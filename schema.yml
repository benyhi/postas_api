      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashboxRead'
          description: ''
  /api/v1/cashboxes/{uuid}/notify-email/:
    post:
      operationId: v1_cashboxes_notify_email_create
      description: Envia al OWNER del tenant un email con la informacion de apertura
        o cierre de una caja, segun el estado actual de la caja.
      summary: Enviar email de notificacion de caja
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Cashbox
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashboxNotifyEmailResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashboxNotifyEmailError'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashboxNotifyEmailForbidden'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashboxNotifyEmailNotFound'
          description: ''
  /api/v1/cashboxes/close/:
    post:
      operationId: v1_cashboxes_close_create
      description: Cierra la caja abierta del tenant. Calcula expected_amount y difference
        automaticamente.
      summary: Cerrar caja
      tags:
      - Cashbox
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CashboxCloseRequest'
            examples:
              CerrarCaja:
                value:
                  final_amount: '12500.00'
                summary: Cerrar caja
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CashboxCloseRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CashboxCloseRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashboxRead'
          description: ''
  /api/v1/cashboxes/current/:
    get:
      operationId: v1_cashboxes_current_retrieve
      description: Devuelve la caja abierta actualmente para el tenant.
      summary: Caja actual
      tags:
      - Cashbox
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashboxRead'
          description: ''
  /api/v1/cashboxes/open/:
    post:
      operationId: v1_cashboxes_open_create
      description: Abre una nueva caja con un monto inicial. Solo se permite una caja
        abierta por tenant.
      summary: Abrir caja
      tags:
      - Cashbox
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CashboxOpenRequest'
            examples:
              AbrirCaja:
                value:
                  initial_amount: '5000.00'
                summary: Abrir caja
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CashboxOpenRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CashboxOpenRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashboxRead'
          description: ''

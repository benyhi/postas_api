      description: |-
        GET    /api/v1/cloud/images/   → lista imágenes del tenant
        POST   /api/v1/cloud/images/   → sube una imagen al tenant
        DELETE /api/v1/cloud/images/   → elimina una imagen del tenant
      tags:

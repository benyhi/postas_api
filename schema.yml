openapi: 3.0.3
info:
  title: POSTAS API
  version: 1.0.0
  description: API para sistema de punto de venta (POS) multi-tenant
paths:
  /api/v1/audit/:
    get:
      operationId: v1_audit_list
      parameters:
      - in: query
        name: action
        schema:
          type: string
          enum:
          - CASHBOX
          - CREATE
          - DELETE
          - LOGIN
          - SALE
          - UPDATE
        description: |-
          * `CREATE` - Create
          * `UPDATE` - Update
          * `DELETE` - Delete
          * `LOGIN` - Login
          * `SALE` - Sale
          * `CASHBOX` - Cashbox
      - in: query
        name: entity
        schema:
          type: string
          enum:
          - CASHBOX
          - CATEGORY
          - PRODUCT
          - SALE
          - USER
        description: |-
          * `USER` - User
          * `PRODUCT` - Product
          * `CATEGORY` - Category
          * `SALE` - Sale
          * `CASHBOX` - Cashbox
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: timestamp__date
        schema:
          type: string
          format: date
      - in: query
        name: timestamp__gte
        schema:
          type: string
          format: date-time
      - in: query
        name: timestamp__lte
        schema:
          type: string
          format: date-time
      - in: query
        name: user
        schema:
          type: string
          format: uuid
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditLogList'
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: v1_auth_login_create
      description: Autentica un usuario con tenant_id, username y password. Devuelve
        tokens JWT con claims de tenant_id, role y user_id.
      summary: Login
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPairRequest'
            examples:
              LoginExitoso:
                value:
                  tenant_id: 00000000-0000-0000-0000-000000000001
                  username: owner
                  password: owner1234
                summary: Login exitoso
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPairRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
              examples:
                RespuestaExitosa:
                  value:
                    refresh: eyJhbGciOiJIUzI1NiIs...
                    access: eyJhbGciOiJIUzI1NiIs...
                  summary: Respuesta exitosa
          description: ''
  /api/v1/auth/token/refresh/:
    post:
      operationId: v1_auth_token_refresh_create
      description: Obtiene un nuevo access token usando el refresh token.
      summary: Refrescar token
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/cashboxes/:
    get:
      operationId: v1_cashboxes_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCashboxReadList'
          description: ''
  /api/v1/cashboxes/{uuid}/:
    get:
      operationId: v1_cashboxes_retrieve
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashboxRead'
          description: ''
  /api/v1/cashboxes/close/:
    post:
      operationId: v1_cashboxes_close_create
      description: Cierra la caja abierta del tenant. Calcula expected_amount y difference
        automaticamente.
      summary: Cerrar caja
      tags:
      - Cashbox
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CashboxCloseRequest'
            examples:
              CerrarCaja:
                value:
                  final_amount: '12500.00'
                summary: Cerrar caja
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CashboxCloseRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CashboxCloseRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashboxRead'
          description: ''
  /api/v1/cashboxes/current/:
    get:
      operationId: v1_cashboxes_current_retrieve
      description: Devuelve la caja abierta actualmente para el tenant.
      summary: Caja actual
      tags:
      - Cashbox
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashboxRead'
          description: ''
  /api/v1/cashboxes/open/:
    post:
      operationId: v1_cashboxes_open_create
      description: Abre una nueva caja con un monto inicial. Solo se permite una caja
        abierta por tenant.
      summary: Abrir caja
      tags:
      - Cashbox
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CashboxOpenRequest'
            examples:
              AbrirCaja:
                value:
                  initial_amount: '5000.00'
                summary: Abrir caja
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CashboxOpenRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CashboxOpenRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashboxRead'
          description: ''
  /api/v1/categories/:
    get:
      operationId: v1_categories_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCategoryList'
          description: ''
    post:
      operationId: v1_categories_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
  /api/v1/categories/{uuid}/:
    get:
      operationId: v1_categories_retrieve
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
    put:
      operationId: v1_categories_update
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
    patch:
      operationId: v1_categories_partial_update
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCategoryRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCategoryRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCategoryRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
    delete:
      operationId: v1_categories_destroy
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/products/:
    get:
      operationId: v1_products_list
      parameters:
      - in: query
        name: category
        schema:
          type: string
          format: uuid
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProductList'
          description: ''
    post:
      operationId: v1_products_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProductRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProductRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          description: ''
  /api/v1/products/{uuid}/:
    get:
      operationId: v1_products_retrieve
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          description: ''
    put:
      operationId: v1_products_update
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProductRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProductRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          description: ''
    patch:
      operationId: v1_products_partial_update
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProductRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProductRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProductRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          description: ''
    delete:
      operationId: v1_products_destroy
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/products/search/:
    get:
      operationId: v1_products_search_list
      description: 'Busca productos por nombre o codigo de barras. Parametro: ?q=texto'
      summary: Buscar productos
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
        description: Texto a buscar en nombre o barcode
      tags:
      - Products
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProductList'
          description: ''
  /api/v1/reports/cashbox/summary/:
    get:
      operationId: v1_reports_cashbox_summary_retrieve
      description: Resumen de una caja especifica o la caja abierta actual. Incluye
        desglose por metodo de pago.
      summary: Resumen de caja
      parameters:
      - in: query
        name: cashbox_id
        schema:
          type: string
        description: UUID de la caja. Si no se envia, usa la caja abierta.
      tags:
      - Reports
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashboxSummaryReport'
          description: ''
  /api/v1/reports/products/top/:
    get:
      operationId: v1_reports_products_top_list
      description: Top N productos por cantidad vendida. Filtra por rango de fechas
        y limite.
      summary: Productos mas vendidos
      parameters:
      - in: query
        name: from
        schema:
          type: string
        description: 'Fecha desde (YYYY-MM-DD). Por defecto: hoy.'
      - in: query
        name: limit
        schema:
          type: integer
        description: 'Cantidad maxima de productos (default: 10)'
      - in: query
        name: to
        schema:
          type: string
        description: Fecha hasta (YYYY-MM-DD)
      tags:
      - Reports
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TopProductsReport'
              examples:
                Respuesta:
                  value:
                  - - product__uuid: uuid
                      product__name: Coca Cola 500ml
                      total_quantity: 45.0
                      total_revenue: 67500.0
          description: ''
  /api/v1/reports/sales/by-payment/:
    get:
      operationId: v1_reports_sales_by_payment_list
      description: Desglose de ventas agrupadas por metodo de pago. Filtra por rango
        de fechas.
      summary: Ventas por metodo de pago
      parameters:
      - in: query
        name: from
        schema:
          type: string
        description: 'Fecha desde (YYYY-MM-DD). Por defecto: hoy.'
      - in: query
        name: to
        schema:
          type: string
        description: Fecha hasta (YYYY-MM-DD)
      tags:
      - Reports
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SalesByPaymentReport'
              examples:
                Respuesta:
                  value:
                  - - payment_method: CASH
                      total: 15000.0
                      count: 8
                    - payment_method: DEBIT
                      total: 10000.0
                      count: 4
          description: ''
  /api/v1/reports/sales/daily/:
    get:
      operationId: v1_reports_sales_daily_retrieve
      description: Retorna total vendido, cantidad de ventas y promedio. Filtra por
        rango de fechas (from/to). Sin fechas, muestra solo hoy.
      summary: Reporte de ventas diarias
      parameters:
      - in: query
        name: from
        schema:
          type: string
        description: 'Fecha desde (YYYY-MM-DD). Por defecto: hoy.'
      - in: query
        name: to
        schema:
          type: string
        description: Fecha hasta (YYYY-MM-DD)
      tags:
      - Reports
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailySalesReport'
              examples:
                Respuesta:
                  value:
                    total_sold: 25000.0
                    sale_count: 12
                    average_sale: 2083.33
          description: ''
  /api/v1/sales/:
    get:
      operationId: v1_sales_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSaleReadList'
          description: ''
    post:
      operationId: v1_sales_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaleCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SaleCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SaleCreateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaleCreate'
          description: ''
  /api/v1/sales/{uuid}/:
    get:
      operationId: v1_sales_retrieve
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaleRead'
          description: ''
  /api/v1/sales/{uuid}/cancel/:
    post:
      operationId: v1_sales_cancel_create
      description: Cancela una venta y revierte el stock de los productos. Solo ADMIN
        u OWNER.
      summary: Cancelar venta
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Sales
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaleRead'
          description: ''
  /api/v1/users/:
    get:
      operationId: v1_users_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUserReadList'
          description: ''
    post:
      operationId: v1_users_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/users/{uuid}/:
    get:
      operationId: v1_users_retrieve
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRead'
          description: ''
    put:
      operationId: v1_users_update
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    patch:
      operationId: v1_users_partial_update
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    delete:
      operationId: v1_users_destroy
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
components:
  schemas:
    ActionEnum:
      enum:
      - CREATE
      - UPDATE
      - DELETE
      - LOGIN
      - SALE
      - CASHBOX
      type: string
      description: |-
        * `CREATE` - Create
        * `UPDATE` - Update
        * `DELETE` - Delete
        * `LOGIN` - Login
        * `SALE` - Sale
        * `CASHBOX` - Cashbox
    AuditLog:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
        tenant_id:
          type: string
          format: uuid
        user:
          type: string
          format: uuid
          nullable: true
        user_username:
          type: string
          readOnly: true
        action:
          $ref: '#/components/schemas/ActionEnum'
        entity:
          $ref: '#/components/schemas/EntityEnum'
        entity_id:
          type: string
          format: uuid
        timestamp:
          type: string
          format: date-time
          readOnly: true
        metadata: {}
      required:
      - action
      - entity
      - entity_id
      - tenant_id

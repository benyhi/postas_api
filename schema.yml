components:
  schemas:
    ActionEnum:
      enum:
      - CREATE
      - UPDATE
      - DELETE
      - LOGIN
      - SALE
      - CASHBOX
      - CASHBOX_EMAIL
      - CASHBOX_EMAIL_SKIP
      - CASHBOX_EMAIL_FAILED
      type: string
      description: |-
        * `CREATE` - Create
        * `UPDATE` - Update
        * `DELETE` - Delete
        * `LOGIN` - Login
        * `SALE` - Sale
        * `CASHBOX` - Cashbox
        * `CASHBOX_EMAIL` - Cashbox email
        * `CASHBOX_EMAIL_SKIP` - Cashbox email skipped
        * `CASHBOX_EMAIL_FAILED` - Cashbox email failed
    ArcaConfigurationResponse:
      type: object
      properties:
        tenant_id:
          type: string
          format: uuid
        automatic_invoicing_enabled:
          type: boolean
        arca_environment:
          $ref: '#/components/schemas/ArcaEnvironmentB91Enum'
        profile:
          type: object
          additionalProperties: {}
          nullable: true
      required:
      - arca_environment
      - automatic_invoicing_enabled
      - profile
      - tenant_id
    ArcaConfigurationWriteRequest:
      type: object
      properties:
        automatic_invoicing_enabled:
          type: boolean
        arca_environment:
          $ref: '#/components/schemas/ArcaEnvironmentB91Enum'
        arca_cuit:
          type: string
          minLength: 1
          pattern: ^\d{11}$
        certificate:
          type: string
          writeOnly: true
          minLength: 1
        private_key:
          type: string
          writeOnly: true
          minLength: 1
        access_token:
          type: string
          writeOnly: true
          minLength: 1
        point_of_sale:
          type: integer
          minimum: 1
        automatic_voucher_type:
          type: integer
          minimum: 1
        concept:
          type: integer
          maximum: 3
          minimum: 1
        default_vat_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
        default_vat_id:
          type: integer
          minimum: 1
    ArcaEnvironmentB91Enum:
      enum:
      - development
      - production
      type: string
      description: |-
        * `development` - development
        * `production` - production
    ArcaExplicitInvoiceCreateRequest:
      type: object
      properties:
        external_id:
          type: string
          minLength: 1
          maxLength: 160
        sale_id:
          type: string
          format: uuid
          nullable: true
        receiver:
          $ref: '#/components/schemas/ArcaReceiverRequest'
        invoice_date:
          type: string
          format: date
        service_start_date:
          type: string
          format: date
          nullable: true
        service_end_date:
          type: string
          format: date
          nullable: true
        payment_due_date:
          type: string
          format: date
          nullable: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/ArcaItemRequest'
        voucher_number:
          type: integer
          minimum: 1
      required:
      - external_id
      - items
      - voucher_number
    ArcaInvoiceCreateRequest:
      type: object
      properties:
        external_id:
          type: string
          minLength: 1
          maxLength: 160
        sale_id:
          type: string
          format: uuid
          nullable: true
        receiver:
          $ref: '#/components/schemas/ArcaReceiverRequest'
        invoice_date:

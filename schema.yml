openapi: 3.0.3
info:
  title: POSTAS API
  version: 1.0.0
  description: API para sistema de punto de venta (POS) multi-tenant
paths:
  /api/v1/arca/configuration/:
    get:
      operationId: v1_arca_configuration_retrieve
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArcaConfigurationResponse'
          description: ''
    put:
      operationId: v1_arca_configuration_update
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArcaConfigurationWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ArcaConfigurationWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ArcaConfigurationWriteRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArcaConfigurationResponse'
          description: ''
    delete:
      operationId: v1_arca_configuration_destroy
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/arca/invoices/:
    post:
      operationId: v1_arca_invoices_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArcaInvoiceCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ArcaInvoiceCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ArcaInvoiceCreateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArcaInvoiceResponse'
          description: ''
  /api/v1/arca/invoices/by-external-id/{external_id}/:
    get:
      operationId: v1_arca_invoices_by_external_id_retrieve
      parameters:
      - in: path
        name: external_id
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArcaInvoiceResponse'
          description: ''
  /api/v1/arca/invoices/explicit/:
    post:
      operationId: v1_arca_invoices_explicit_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArcaExplicitInvoiceCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ArcaExplicitInvoiceCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ArcaExplicitInvoiceCreateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArcaInvoiceResponse'
          description: ''
  /api/v1/arca/invoices/fiscal/:
    get:
      operationId: v1_arca_invoices_fiscal_retrieve
      parameters:
      - in: query
        name: environment
        schema:
          enum:
          - development
          - production
          type: string
          minLength: 1
        description: |-
          * `development` - development
          * `production` - production
        required: true
      - in: query
        name: point_of_sale
        schema:
          type: integer
          minimum: 1
        required: true
      - in: query
        name: voucher_number
        schema:
          type: integer
          minimum: 1
        required: true
      - in: query
        name: voucher_type
        schema:
          type: integer
          minimum: 1
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArcaInvoiceResponse'
          description: ''
  /api/v1/arca/invoices/last-voucher/:
    get:
      operationId: v1_arca_invoices_last_voucher_retrieve
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArcaLastVoucherResponse'
          description: ''
  /api/v1/audit/:
    get:
      operationId: v1_audit_list
      parameters:
      - in: query
        name: action
        schema:
          type: string
          enum:
          - CASHBOX
          - CASHBOX_EMAIL
          - CASHBOX_EMAIL_FAILED
          - CASHBOX_EMAIL_SKIP
          - CREATE
          - DELETE
          - LOGIN
          - SALE
          - UPDATE
        description: |-
          * `CREATE` - Create
          * `UPDATE` - Update
          * `DELETE` - Delete
          * `LOGIN` - Login
          * `SALE` - Sale
          * `CASHBOX` - Cashbox
          * `CASHBOX_EMAIL` - Cashbox email
          * `CASHBOX_EMAIL_SKIP` - Cashbox email skipped
          * `CASHBOX_EMAIL_FAILED` - Cashbox email failed
      - in: query
        name: entity
        schema:
          type: string
          enum:
          - CASHBOX
          - CASH_REGISTER
          - CATEGORY
          - PRODUCT
          - SALE
          - TENANT_CONFIG
          - USER
        description: |-
          * `USER` - User
          * `PRODUCT` - Product
          * `CATEGORY` - Category
          * `SALE` - Sale
          * `CASHBOX` - Cashbox
          * `CASH_REGISTER` - Cash register
          * `TENANT_CONFIG` - Tenant config
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: timestamp__date
        schema:
          type: string
          format: date
      - in: query
        name: timestamp__gte
        schema:
          type: string
          format: date-time
      - in: query
        name: timestamp__lte
        schema:
          type: string
          format: date-time
      - in: query
        name: user
        schema:
          type: string
          format: uuid
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditLogList'
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: v1_auth_login_create
      description: Autentica un usuario con tenant_id, username y password. Devuelve
        tokens JWT con claims de tenant_id, role y user_id.
      summary: Login
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPairRequest'
            examples:
              LoginExitoso:
                value:
                  tenant_id: 00000000-0000-0000-0000-000000000001
                  username: owner
                  password: owner1234
                summary: Login exitoso
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPairRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
              examples:
                RespuestaExitosa:
                  value:
                    refresh: eyJhbGciOiJIUzI1NiIs...
                    access: eyJhbGciOiJIUzI1NiIs...
                  summary: Respuesta exitosa
          description: ''
  /api/v1/auth/password-reset/:
    post:
      operationId: v1_auth_password_reset_create
      description: Envía un email con un enlace para restablecer la contraseña.
      summary: Solicitar restablecimiento de contraseña
      tags:
      - Auth
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/auth/password-reset/confirm/:
    post:
      operationId: v1_auth_password_reset_confirm_create
      description: Valida el token y establece la nueva contraseña.
      summary: Confirmar restablecimiento de contraseña
      tags:
      - Auth
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/auth/token/refresh/:
    post:
      operationId: v1_auth_token_refresh_create
      description: Obtiene un nuevo access token usando el refresh token.
      summary: Refrescar token
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/billing/current-plan/:
    get:
      operationId: v1_billing_current_plan_retrieve
      description: Devuelve el plan actual, estado de suscripcion y consumos/limites
        de features del tenant autenticado. Es un endpoint solo lectura para el frontend
        y no modifica datos de billing.
      summary: Plan y consumos del tenant actual
      tags:
      - Billing
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantBillingStatus'
              examples:
                Respuesta:
                  value:
                    tenant_id: 00000000-0000-0000-0000-000000000001
                    status: active
                    subscription:
                      plan: business_ai
                      plan_name: Business AI
                      status: active
                      current_period_start: '2026-06-01T00:00:00Z'
                      current_period_end: '2026-07-01T00:00:00Z'
                    features:
                      document_extraction:
                        enabled: true
                        limit: 100
                        used: 12
                        remaining: 88
                        reset_period: monthly
                      products:
                        enabled: true
                        limit: 1000
                        used: null
                        remaining: null
                        reset_period: null
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingError'
          description: JWT sin tenant_id.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingError'
          description: Token faltante o invalido.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingError'
          description: El tenant no tiene suscripcion registrada en platform.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingError'
          description: No se pudo consultar postas_platform_api.
  /api/v1/cash-registers/:
    get:
      operationId: v1_cash_registers_list
      summary: Listar terminales activas
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - Cash registers
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCashRegisterList'
          description: ''
    post:
      operationId: v1_cash_registers_create
      summary: Crear terminal
      tags:
      - Cash registers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CashRegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CashRegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CashRegisterRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashRegister'
          description: ''
  /api/v1/cash-registers/{uuid}/:
    get:
      operationId: v1_cash_registers_retrieve
      summary: Detalle de terminal
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Cash registers
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashRegister'
          description: ''
    put:
      operationId: v1_cash_registers_update
      summary: Actualizar terminal
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Cash registers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CashRegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CashRegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CashRegisterRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashRegister'
          description: ''
    patch:
      operationId: v1_cash_registers_partial_update
      summary: Renombrar o desactivar terminal
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Cash registers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCashRegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCashRegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCashRegisterRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashRegister'
          description: ''
  /api/v1/cashboxes/:
    get:
      operationId: v1_cashboxes_list
      description: Lista paginada de todas las cajas (abiertas y cerradas). Solo ADMIN
        u OWNER.
      summary: Listar cajas
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: register_id
        schema:
          type: string
        description: UUID de la terminal
      - in: query
        name: status
        schema:
          type: string
          enum:
          - CLOSED
          - OPEN
        description: Estado de la sesion
      - in: query
        name: user_id
        schema:
          type: string
        description: UUID del operador que abrio
      tags:
      - Cashbox
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCashboxReadList'
          description: ''
  /api/v1/cashboxes/{uuid}/:
    get:
      operationId: v1_cashboxes_retrieve
      description: Devuelve el detalle de una caja por UUID. Solo ADMIN u OWNER.
      summary: Detalle de caja
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Cashbox
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashboxRead'
          description: ''
  /api/v1/cashboxes/{uuid}/notify-email/:
    post:
      operationId: v1_cashboxes_notify_email_create
      description: Envia al OWNER del tenant un email con la informacion de apertura
        o cierre de una caja, segun el estado actual de la caja.
      summary: Enviar email de notificacion de caja
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Cashbox
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashboxNotifyEmailResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashboxNotifyEmailError'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashboxNotifyEmailForbidden'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashboxNotifyEmailNotFound'
          description: ''
  /api/v1/cashboxes/close/:
    post:
      operationId: v1_cashboxes_close_create
      description: Cierra la sesion abierta del usuario. ADMIN/OWNER pueden enviar
        cashbox_id para cerrar administrativamente otra sesion del tenant.
      summary: Cerrar caja
      tags:
      - Cashbox
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CashboxCloseRequest'
            examples:
              CerrarCaja:
                value:
                  final_amount: '12500.00'
                summary: Cerrar caja
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CashboxCloseRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CashboxCloseRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashboxRead'
          description: ''
  /api/v1/cashboxes/current/:
    get:
      operationId: v1_cashboxes_current_retrieve
      description: Devuelve la sesion abierta del usuario autenticado.
      summary: Caja actual
      tags:
      - Cashbox
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashboxRead'
          description: ''
  /api/v1/cashboxes/open/:
    post:
      operationId: v1_cashboxes_open_create
      description: Abre una sesion en una terminal activa. Cada usuario y terminal
        solo pueden tener una sesion abierta; el limite simultaneo depende del plan.
      summary: Abrir caja
      tags:
      - Cashbox
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CashboxOpenRequest'
            examples:
              AbrirCaja:
                value:
                  register_id: uuid-de-la-terminal
                  initial_amount: '5000.00'
                summary: Abrir caja
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CashboxOpenRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CashboxOpenRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashboxRead'
          description: ''
  /api/v1/categories/:
    get:
      operationId: v1_categories_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCategoryList'
          description: ''
    post:
      operationId: v1_categories_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
  /api/v1/categories/{uuid}/:
    get:
      operationId: v1_categories_retrieve
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
    put:
      operationId: v1_categories_update
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
    patch:
      operationId: v1_categories_partial_update
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCategoryRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCategoryRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCategoryRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
    delete:
      operationId: v1_categories_destroy
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/cloud/health/:
    get:
      operationId: v1_cloud_health_retrieve
      description: GET /api/v1/cloud/health/   → prueba conectividad con el bucket
        (upload -> read -> delete)
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/cloud/images/:
    get:
      operationId: v1_cloud_images_retrieve
      description: |-
        GET    /api/v1/cloud/images/   → lista imágenes del tenant
        POST   /api/v1/cloud/images/   → sube una imagen al tenant
        DELETE /api/v1/cloud/images/   → elimina una imagen del tenant
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
    post:
      operationId: v1_cloud_images_create
      description: |-
        GET    /api/v1/cloud/images/   → lista imágenes del tenant
        POST   /api/v1/cloud/images/   → sube una imagen al tenant
        DELETE /api/v1/cloud/images/   → elimina una imagen del tenant
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
    delete:
      operationId: v1_cloud_images_destroy
      description: |-
        GET    /api/v1/cloud/images/   → lista imágenes del tenant
        POST   /api/v1/cloud/images/   → sube una imagen al tenant
        DELETE /api/v1/cloud/images/   → elimina una imagen del tenant
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '204':

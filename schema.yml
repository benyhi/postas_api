            schema:
              $ref: '#/components/schemas/ProductImportUploadRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                RespuestaOK:
                  value:
                    result: OK
                    summary:
                      total_rows: 2
                      created: 1
                      updated: 1
                      failed: 0
                      matches: 1
                      elapsed_ms: 42
                      eta_ms: 0
                    items_loaded: []
                    matches: []
                    errors: []
                  summary: Respuesta OK
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '403':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''

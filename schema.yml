openapi: 3.0.3
info:
  title: POSTAS API
  version: 1.0.0
  description: API para sistema de punto de venta (POS) multi-tenant
paths:
  /api/v1/audit/:
    get:
      operationId: v1_audit_list
      parameters:
      - in: query
        name: action
        schema:
          type: string
          enum:
          - CASHBOX
          - CASHBOX_EMAIL
          - CASHBOX_EMAIL_FAILED
          - CASHBOX_EMAIL_SKIP
          - CREATE
          - DELETE
          - LOGIN
          - SALE
          - UPDATE
        description: |-
          * `CREATE` - Create
          * `UPDATE` - Update
          * `DELETE` - Delete
          * `LOGIN` - Login
          * `SALE` - Sale
          * `CASHBOX` - Cashbox
          * `CASHBOX_EMAIL` - Cashbox email
          * `CASHBOX_EMAIL_SKIP` - Cashbox email skipped
          * `CASHBOX_EMAIL_FAILED` - Cashbox email failed
      - in: query
        name: entity
        schema:
          type: string
          enum:
          - CASHBOX
          - CATEGORY
          - PRODUCT
          - SALE
          - TENANT_CONFIG
          - USER
        description: |-
          * `USER` - User
          * `PRODUCT` - Product
          * `CATEGORY` - Category
          * `SALE` - Sale
          * `CASHBOX` - Cashbox
          * `TENANT_CONFIG` - Tenant config
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: timestamp__date
        schema:
          type: string
          format: date
      - in: query
        name: timestamp__gte
        schema:
          type: string
          format: date-time
      - in: query
        name: timestamp__lte
        schema:
          type: string
          format: date-time
      - in: query
        name: user
        schema:
          type: string
          format: uuid
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditLogList'
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: v1_auth_login_create
      description: Autentica un usuario con tenant_id, username y password. Devuelve
        tokens JWT con claims de tenant_id, role y user_id.
      summary: Login
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPairRequest'
            examples:
              LoginExitoso:
                value:
                  tenant_id: 00000000-0000-0000-0000-000000000001
                  username: owner
                  password: owner1234
                summary: Login exitoso
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPairRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
              examples:
                RespuestaExitosa:
                  value:
                    refresh: eyJhbGciOiJIUzI1NiIs...
                    access: eyJhbGciOiJIUzI1NiIs...
                  summary: Respuesta exitosa
          description: ''
  /api/v1/auth/password-reset/:
    post:
      operationId: v1_auth_password_reset_create
      description: Envía un email con un enlace para restablecer la contraseña.
      summary: Solicitar restablecimiento de contraseña
      tags:
      - Auth
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/auth/password-reset/confirm/:
    post:
      operationId: v1_auth_password_reset_confirm_create
      description: Valida el token y establece la nueva contraseña.
      summary: Confirmar restablecimiento de contraseña
      tags:
      - Auth
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/auth/token/refresh/:
    post:
      operationId: v1_auth_token_refresh_create
      description: Obtiene un nuevo access token usando el refresh token.
      summary: Refrescar token
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/cashboxes/:
    get:

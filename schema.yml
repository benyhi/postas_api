components:
  schemas:
    ActionEnum:
      enum:
      - CREATE
      - UPDATE
      - DELETE
      - LOGIN
      - SALE
      - CASHBOX
      - CASHBOX_EMAIL
      - CASHBOX_EMAIL_SKIP
      - CASHBOX_EMAIL_FAILED
      type: string
      description: |-
        * `CREATE` - Create
        * `UPDATE` - Update
        * `DELETE` - Delete
        * `LOGIN` - Login
        * `SALE` - Sale
        * `CASHBOX` - Cashbox
        * `CASHBOX_EMAIL` - Cashbox email
        * `CASHBOX_EMAIL_SKIP` - Cashbox email skipped
        * `CASHBOX_EMAIL_FAILED` - Cashbox email failed
    AuditLog:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
        tenant_id:
          type: string
          format: uuid
        user:
          type: string
          format: uuid
          nullable: true
        user_username:
          type: string
          readOnly: true
        action:
          $ref: '#/components/schemas/ActionEnum'
        entity:
          $ref: '#/components/schemas/EntityEnum'
        entity_id:
          type: string
          format: uuid
        timestamp:
          type: string
          format: date-time
          readOnly: true
        metadata: {}
      required:
      - action
      - entity
      - entity_id
      - tenant_id
      - timestamp
      - user_username
      - uuid
    CashboxCloseRequest:
      type: object
      properties:
        final_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
      required:
      - final_amount
    CashboxNotifyEmailError:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    CashboxNotifyEmailForbidden:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    CashboxNotifyEmailNotFound:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    CashboxNotifyEmailResponse:
      type: object
      properties:
        detail:
          type: string
        cashbox:
          type: string
          format: uuid
        event:
          type: string
        sent:
          type: integer
        recipients_count:
          type: integer
        provider:
          type: string
        delivery_uuid:
          type: string
          format: uuid
        estimated_cost_usd:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,6})?$
      required:
      - cashbox
      - delivery_uuid
      - detail
      - estimated_cost_usd
      - event
      - provider
      - recipients_count
      - sent
    CashboxOpenRequest:
      type: object
      properties:
        initial_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
      required:
      - initial_amount
    CashboxRead:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
        tenant_id:
          type: string
          format: uuid
        opened_by:
          type: string
          format: uuid
        opened_by_username:
          type: string
          readOnly: true
        closed_by:
          type: string
          format: uuid
          nullable: true
        closed_by_username:
          type: string
          readOnly: true
        opened_at:
          type: string
          format: date-time
          readOnly: true
        closed_at:
          type: string
          format: date-time
          nullable: true
        initial_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        final_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
        expected_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
        difference:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
        status:
          $ref: '#/components/schemas/CashboxReadStatusEnum'
      required:
      - closed_by_username
      - initial_amount
      - opened_at
      - opened_by
      - opened_by_username
      - tenant_id
      - uuid
    CashboxReadStatusEnum:
      enum:
      - OPEN
      - CLOSED
      type: string
      description: |-
        * `OPEN` - Open
        * `CLOSED` - Closed
    CashboxSummaryReport:
      type: object
      properties:
        cashbox_uuid:
          type: string
          format: uuid
        status:
          type: string
        opened_at:
          type: string
          format: date-time
        closed_at:
          type: string
          format: date-time
          nullable: true
        initial_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        final_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
        expected_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
        difference:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
        total_sold:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        sale_count:
          type: integer
        by_payment_method:
          type: array
          items: {}
      required:
      - by_payment_method
      - cashbox_uuid
      - closed_at
      - difference
      - expected_amount
      - final_amount
      - initial_amount
      - opened_at
      - sale_count
      - status
      - total_sold
    Category:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
        tenant_id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 100
        active:
          type: boolean
          default: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - name
      - tenant_id
      - updated_at
      - uuid
    CategoryRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        active:
          type: boolean
          default: true
      required:
      - name
    CustomTokenObtainPairRequest:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
          minLength: 1
        tenant_id:
          type: string
          format: uuid
          writeOnly: true
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - password
      - tenant_id
      - username
    DailySalesReport:
      type: object
      properties:
        total_sold:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        sale_count:
          type: integer
        average_sale:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
      required:
      - average_sale
      - sale_count
      - total_sold
    DocumentExtractionResult:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
        status:
          $ref: '#/components/schemas/DocumentExtractionResultStatusEnum'
        confidence:
          type: string
          readOnly: true
        products:
          type: string
          readOnly: true
        error_message:
          type: string
          nullable: true
      required:
      - confidence
      - products
      - uuid
    DocumentExtractionResultStatusEnum:
      enum:

<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="supported-color-schemes" content="light">
  <title>{{ title }}</title>
</head>
<body style="margin:0;padding:0;background:#f4f6f8;color:#18212f;font-family:Arial,Helvetica,sans-serif;">
  <div style="display:none;max-height:0;overflow:hidden;opacity:0;color:transparent;">
    {{ preheader }}
  </div>
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background:#f4f6f8;margin:0;padding:0;width:100%;">
    <tr>
      <td align="center" style="padding:24px 12px;">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="width:100%;max-width:640px;background:#ffffff;border:1px solid #d9e1ec;border-radius:8px;">
          <tr>
            <td style="padding:24px 28px 12px 28px;">
              <p style="margin:0 0 12px 0;color:#526175;font-size:13px;line-height:20px;font-weight:700;letter-spacing:0;text-transform:uppercase;">
                {{ brand_name }}
              </p>
              <h1 style="margin:0;color:#18212f;font-size:24px;line-height:32px;font-weight:700;letter-spacing:0;">
                {{ title }}
              </h1>
              <p style="margin:12px 0 0 0;color:#4c5a6c;font-size:15px;line-height:24px;">
                {{ intro }}
              </p>
            </td>
          </tr>
          {% block content %}{% endblock %}
          <tr>
            <td style="padding:18px 28px 24px 28px;border-top:1px solid #edf1f6;">
              <p style="margin:0;color:#66758a;font-size:12px;line-height:18px;">
                Este email fue generado por una accion transaccional en POSTAS.
              </p>
              <p style="margin:8px 0 0 0;color:#66758a;font-size:12px;line-height:18px;">
                Si no reconoces esta actividad, revisa tu cuenta o contacta al administrador.
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
